name: Build (Windows / MSVC)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPS_IMAGE: ghcr.io/${{ github.repository_owner }}/houndtts-deps-win

jobs:
  build-windows:
    name: Windows Docker (MSVC)
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      # --------------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 2a. Start Docker daemon (workaround: actions/runner-images#13729)
      # --------------------------------------------------------
      - name: Start Docker service
        shell: powershell
        run: |
          Start-Service docker
          # Wait until the daemon is responsive (up to 60 s)
          $timeout = 60
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            try {
              docker version | Out-Null
              Write-Host "Docker daemon is ready."
              return
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          throw "Docker daemon did not start within $timeout seconds."

      # --------------------------------------------------------
      # 2b. Verify Docker is running Windows containers
      # --------------------------------------------------------
      - name: Verify Docker (Windows containers)
        shell: powershell
        run: |
          docker version
          $os = docker version --format "{{.Server.Os}}"
          if ($os -ne "windows") {
            throw "Expected Windows containers but got: $os"
          }
          Write-Host "Docker daemon OS: $os"

      # --------------------------------------------------------
      # 3. Log in to ghcr.io and pull/refresh the deps layer cache
      # --------------------------------------------------------
      - name: Log in to GitHub Container Registry
        shell: powershell
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull deps cache image (best-effort)
        shell: powershell
        run: docker pull ${{ env.DEPS_IMAGE }}:latest; exit 0

      - name: Build and push deps stage
        shell: powershell
        run: |
          $buildArgs = @("build", "--isolation=hyperv", "-f", "Dockerfile.windows",
            "-t", "${{ env.DEPS_IMAGE }}:latest",
            "--cache-from", "${{ env.DEPS_IMAGE }}:latest",
            "--target", "deps")
          Get-Content deps.env | Where-Object { $_ -match '^\s*[^#]' -and $_ -match '=' } | ForEach-Object {
            $parts = $_ -split '=', 2
            $buildArgs += "--build-arg"
            $buildArgs += ($parts[0].Trim() + '=' + $parts[1].Trim())
          }
          $buildArgs += "."
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "docker build (deps) failed" }
          docker push ${{ env.DEPS_IMAGE }}:latest

      # --------------------------------------------------------
      # 4a. Derive version from git tag (v1.2.3 → 1.2.3)
      # --------------------------------------------------------
      - name: Derive version from tag
        id: version
        shell: powershell
        run: |
          if ("${{ github.ref }}" -match '^refs/tags/v(.+)$') {
            $full = $Matches[1]
            # CMake project(VERSION) only accepts numeric x.y.z[.w] — strip pre-release suffix
            $ver = ($full -split '-')[0]
          } else {
            $full = "0.0.0"
            $ver  = "0.0.0"
          }
          Write-Host "Full version : $full"
          Write-Host "CMake version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "FULL_VERSION=$full" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------------
      # 4b. Build the Docker image
      #     --target output produces the final merged image.
      # --------------------------------------------------------
      - name: Build Docker image
        shell: powershell
        run: |
          $buildArgs = @("build", "--isolation=hyperv", "-f", "Dockerfile.windows",
            "-t", "houndtts-builder-msvc",
            "--target", "output",
            "--cache-from", "${{ env.DEPS_IMAGE }}:latest",
            "--build-arg", "HOUNDTTS_VERSION=${{ steps.version.outputs.VERSION }}",
            "--build-arg", "HOUNDTTS_VERSION_FULL=${{ steps.version.outputs.FULL_VERSION }}")
          Get-Content deps.env | Where-Object { $_ -match '^\s*[^#]' -and $_ -match '=' } | ForEach-Object {
            $parts = $_ -split '=', 2
            $buildArgs += "--build-arg"
            $buildArgs += ($parts[0].Trim() + '=' + $parts[1].Trim())
          }
          $buildArgs += "."
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "docker build (output) failed" }

      # --------------------------------------------------------
      # 5. Extract dist from the container
      # --------------------------------------------------------
      - name: Extract dist
        shell: powershell
        run: |
          $id = docker create --isolation=hyperv houndtts-builder-msvc
          try {
            New-Item -ItemType Directory -Force dist | Out-Null
            docker cp "${id}:C:\dist" .
          } finally {
            docker rm $id | Out-Null
          }

      # --------------------------------------------------------
      # 7. Upload artifacts
      # --------------------------------------------------------
      - name: Upload dist/base
        uses: actions/upload-artifact@v4
        with:
          name: HoundTTS-windows
          path: dist/base/
          if-no-files-found: error

      - name: Upload dist/piper-addon
        uses: actions/upload-artifact@v4
        with:
          name: HoundTTS-piper-addon-windows
          path: dist/piper-addon/
          if-no-files-found: error

      # --------------------------------------------------------
      # 8. Create GitHub Release (on tag push only)
      # --------------------------------------------------------
      - name: Zip release packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          Compress-Archive -Path dist\base\*         -DestinationPath HoundTTS-windows.zip         -Force
          Compress-Archive -Path dist\piper-addon\*  -DestinationPath HoundTTS-piper-addon-windows.zip  -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HoundTTS-windows.zip
            HoundTTS-piper-addon-windows.zip
          generate_release_notes: true
          draft: true
