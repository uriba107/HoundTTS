name: Build (Windows / MSVC)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DEPS_IMAGE: ghcr.io/uriba107/houndtts/houndtts-deps-win

jobs:
  # ================================================================
  # Job 1: build-all — build deps once, then all DLLs sequentially
  #         in the same runner so Docker layer cache reuses deps,
  #         avoiding pulling the ~15 GB deps image for every target.
  # ================================================================
  build-all:
    name: Build All
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      cache-tag: ${{ steps.cache-tag.outputs.TAG }}
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Start Docker service
        shell: powershell
        run: |
          Start-Service docker
          $timeout = 60
          $timer = [Diagnostics.Stopwatch]::StartNew()
          while ($timer.Elapsed.TotalSeconds -lt $timeout) {
            try {
              docker version | Out-Null
              Write-Host "Docker daemon is ready."
              return
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          throw "Docker daemon did not start within $timeout seconds."

      - name: Verify Docker (Windows containers)
        shell: powershell
        run: |
          docker version
          $os = docker version --format "{{.Server.Os}}"
          if ($os -ne "windows") {
            throw "Expected Windows containers but got: $os"
          }
          Write-Host "Docker daemon OS: $os"

      - name: Derive cache tag
        id: cache-tag
        shell: powershell
        env:
          RAW_REF: ${{ github.head_ref || github.ref_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          $ref = $env:RAW_REF
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $containing = git branch -r --contains HEAD --format='%(refname:short)' 2>$null |
              ForEach-Object { $_ -replace '^origin/','' } |
              Where-Object { $_ -and $_ -ne 'HEAD' }
            if ($containing -contains 'main') {
              $ref = 'main'
            } elseif ($containing.Count -gt 0) {
              $ref = $containing[0]
            } else {
              $ref = 'main'
            }
            Write-Host "Tag build: using branch '$ref' for cache"
          }
          if ([string]::IsNullOrWhiteSpace($ref)) { $ref = "unknown" }
          $tag = ($ref -replace '[^a-zA-Z0-9._-]', '-').ToLower()
          $tag = $tag -replace '^[^a-z0-9]+', ''
          if ([string]::IsNullOrEmpty($tag)) { $tag = "unknown" }
          if ($tag.Length -gt 128) { $tag = $tag.Substring(0, 128) }
          Write-Host "Cache tag: $tag"
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version from tag
        id: version
        shell: powershell
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') {
            $ver = ($Matches[1] -split '-')[0]
          } else {
            $ver = "0.0.0"
          }
          Write-Host "CMake version: $ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Pre-pull deps cache from main (fallback for new branches)
        shell: powershell
        run: |
          docker pull "${{ env.DEPS_IMAGE }}:main" 2>$null | Out-Null
          Write-Host "Pre-pull done (pull errors ignored - cache-from handles miss)"

      # ----------------------------------------------------------
      # Step 1: Build & push deps stage (heavy toolchain ~15 GB)
      #         Subsequent builds in this job reuse local cache.
      # ----------------------------------------------------------
      - name: Build and push deps stage
        shell: powershell
        run: |
          $tag = "${{ steps.cache-tag.outputs.TAG }}"
          $buildArgs = @("build", "-f", "Dockerfile.windows",
            "-t", "${{ env.DEPS_IMAGE }}:${tag}",
            "--cache-from", "${{ env.DEPS_IMAGE }}:main",
            "--cache-from", "${{ env.DEPS_IMAGE }}:${tag}",
            "--target", "deps")
          Get-Content deps.env | Where-Object { $_ -match '^\s*[^#]' -and $_ -match '=' } | ForEach-Object {
            $parts = $_ -split '=', 2
            $buildArgs += "--build-arg"
            $buildArgs += ($parts[0].Trim() + '=' + $parts[1].Trim())
          }
          $buildArgs += "."
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "docker build (deps) failed" }
          docker push "${{ env.DEPS_IMAGE }}:${tag}"
          if ($LASTEXITCODE -ne 0) {
            throw "docker push deps image failed - downstream jobs require the image on GHCR"
          }

      # ----------------------------------------------------------
      # Step 2: Build piper stage — deps layer reused from local cache
      # ----------------------------------------------------------
      - name: Build piper stage
        shell: powershell
        run: |
          $tag = "${{ steps.cache-tag.outputs.TAG }}"
          $buildArgs = @("build", "-f", "Dockerfile.windows",
            "-t", "houndtts-piper",
            "--cache-from", "${{ env.DEPS_IMAGE }}:main",
            "--cache-from", "${{ env.DEPS_IMAGE }}:${tag}",
            "--target", "piper")
          Get-Content deps.env | Where-Object { $_ -match '^\s*[^#]' -and $_ -match '=' } | ForEach-Object {
            $parts = $_ -split '=', 2
            $buildArgs += "--build-arg"
            $buildArgs += ($parts[0].Trim() + '=' + $parts[1].Trim())
          }
          $buildArgs += "."
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "docker build (piper) failed" }

      - name: Extract dist/piper-engine + dist/piper-voices
        shell: powershell
        run: |
          $id = docker create --isolation=hyperv houndtts-piper
          try {
            New-Item -ItemType Directory -Force dist | Out-Null
            docker cp "${id}:C:\dist" .
          } finally {
            docker rm $id | Out-Null
          }

      # ----------------------------------------------------------
      # Step 3: Build supertonic stage — deps layer reused from local cache
      # ----------------------------------------------------------
      - name: Build supertonic stage
        shell: powershell
        run: |
          $tag = "${{ steps.cache-tag.outputs.TAG }}"
          $buildArgs = @("build", "-f", "Dockerfile.windows",
            "-t", "houndtts-supertonic",
            "--cache-from", "${{ env.DEPS_IMAGE }}:main",
            "--cache-from", "${{ env.DEPS_IMAGE }}:${tag}",
            "--target", "supertonic")
          Get-Content deps.env | Where-Object { $_ -match '^\s*[^#]' -and $_ -match '=' } | ForEach-Object {
            $parts = $_ -split '=', 2
            $buildArgs += "--build-arg"
            $buildArgs += ($parts[0].Trim() + '=' + $parts[1].Trim())
          }
          $buildArgs += "."
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "docker build (supertonic) failed" }

      - name: Extract dist/supertonic-engine
        shell: powershell
        run: |
          $id = docker create --isolation=hyperv houndtts-supertonic
          try {
            New-Item -ItemType Directory -Force dist | Out-Null
            docker cp "${id}:C:\dist" .
          } finally {
            docker rm $id | Out-Null
          }

      # ----------------------------------------------------------
      # Step 4: Build base-output stage (compiles HoundTTS.dll) —
      #         deps + build stages reused from local cache
      # ----------------------------------------------------------
      - name: Build base-output stage
        shell: powershell
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $tag = "${{ steps.cache-tag.outputs.TAG }}"
          $buildArgs = @("build", "-f", "Dockerfile.windows",
            "-t", "houndtts-main",
            "--cache-from", "${{ env.DEPS_IMAGE }}:main",
            "--cache-from", "${{ env.DEPS_IMAGE }}:${tag}",
            "--target", "base-output",
            "--build-arg", "HOUNDTTS_VERSION=$env:VERSION")
          Get-Content deps.env | Where-Object { $_ -match '^\s*[^#]' -and $_ -match '=' } | ForEach-Object {
            $parts = $_ -split '=', 2
            $buildArgs += "--build-arg"
            $buildArgs += ($parts[0].Trim() + '=' + $parts[1].Trim())
          }
          $buildArgs += "."
          docker @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "docker build (base-output) failed" }

      - name: Extract dist/base
        shell: powershell
        run: |
          $id = docker create --isolation=hyperv houndtts-main
          try {
            New-Item -ItemType Directory -Force dist | Out-Null
            docker cp "${id}:C:\dist" .
          } finally {
            docker rm $id | Out-Null
          }

      # ----------------------------------------------------------
      # Step 5: Upload all artifacts for downstream jobs
      # ----------------------------------------------------------
      - name: Upload dist/base
        uses: actions/upload-artifact@v6
        with:
          name: HoundTTS-windows
          path: dist/base/
          if-no-files-found: error

      - name: Upload dist/piper-engine
        uses: actions/upload-artifact@v6
        with:
          name: HoundTTS-piper-engine-windows
          path: dist/piper-engine/
          if-no-files-found: error

      - name: Upload dist/piper-voices
        uses: actions/upload-artifact@v6
        with:
          name: HoundTTS-piper-voices-windows
          path: dist/piper-voices/
          if-no-files-found: error

      - name: Upload dist/supertonic-engine
        uses: actions/upload-artifact@v6
        with:
          name: HoundTTS-supertonic-engine-windows
          path: dist/supertonic-engine/
          if-no-files-found: error

  # ================================================================
  # Job 2: release — assemble zip packages and create GitHub Release
  #         Only runs on tag pushes (v*).
  # ================================================================
  release:
    name: Release
    runs-on: windows-2022
    needs: [build-all]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15

    steps:
      - name: Download base package
        uses: actions/download-artifact@v6
        with:
          name: HoundTTS-windows
          path: dist/base/

      - name: Download piper-engine
        uses: actions/download-artifact@v6
        with:
          name: HoundTTS-piper-engine-windows
          path: dist/piper-engine/

      - name: Download piper-voices
        uses: actions/download-artifact@v6
        with:
          name: HoundTTS-piper-voices-windows
          path: dist/piper-voices/

      - name: Download supertonic-engine
        uses: actions/download-artifact@v6
        with:
          name: HoundTTS-supertonic-engine-windows
          path: dist/supertonic-engine/

      - name: Zip release packages
        shell: powershell
        run: |
          Compress-Archive -Path dist\base\*           -DestinationPath HoundTTS-windows.zip                  -Force
          Compress-Archive -Path dist\piper-engine\*   -DestinationPath HoundTTS-piper-engine-windows.zip      -Force
          Compress-Archive -Path dist\piper-voices\*   -DestinationPath HoundTTS-piper-voices-windows.zip      -Force
          Compress-Archive -Path dist\supertonic-engine\* -DestinationPath HoundTTS-supertonic-engine-windows.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            HoundTTS-windows.zip
            HoundTTS-piper-engine-windows.zip
            HoundTTS-piper-voices-windows.zip
            HoundTTS-supertonic-engine-windows.zip
          generate_release_notes: true
          draft: true
